# Build from source.
name: build
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  build_macos:
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
        - python-version: '3.15'
          toxenv: 'py315'
        - python-version: '3.15t'
          toxenv: 'py315t'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install build dependencies
      run: |
        brew update -q
        brew install -q autoconf automake gettext gnu-sed libtool pkgconfig tox || true
        # There currently is no brew formula for free-threaded Python, but setup-python will install it if necessary.
        # shellcheck disable=SC2193
        if [[ "${{ matrix.python-version }}" != *t ]]; then
          brew install -q python@${{ matrix.python-version }}
        fi
        ln -s /usr/local/bin/glibtoolize /usr/local/bin/libtoolize
    - name: Build and test Python module
      run: |
        python utils/update_source.py
        export CXXFLAGS="-std=c++14"
        tox -e ${{ matrix.toxenv }}
  build_ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
        - python-version: '3.10'
          toxenv: 'py310'
        - python-version: '3.11'
          toxenv: 'py311'
        - python-version: '3.12'
          toxenv: 'py312'
        - python-version: '3.13'
          toxenv: 'py313'
        - python-version: '3.14'
          toxenv: 'py314'
        - python-version: '3.14t'
          toxenv: 'py314t'
        - python-version: '3.15'
          toxenv: 'py315'
        - python-version: '3.15t'
          toxenv: 'py315t'
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf automake autopoint autotools-dev build-essential git libtool pkg-config
    - name: Install tox
      run: |
        python -m pip install tox
    - name: Build and test Python module
      run: |
        python utils/update_source.py
        tox -e ${{ matrix.toxenv }}
  build_windows:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ['3.15', '3.15t']
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    - name: Install build dependencies
      run: |
        python3 -m pip install build setuptools wheel
    - name: Build Python module
      run: |
        python utils/update_source.py
        python -m build --wheel
        python -m pip install --no-index --find-links=dist pytsk3
    - name: Test Python module
      run: |
        python run_tests.py
