# Build Python wheels from source using cibuildwheel.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
name: build_wheels
on:
  pull_request:
  push:
  release:
    types: [published]
  # Allow trigger via API
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build_sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf automake autopoint autotools-dev build-essential git libtool pkg-config python3-build
    - name: Build sdist
      run: |
        python utils/update_source.py
        python -m build --sdist
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: cibw-sdist
        path: dist/*.tar.gz
        retention-days: 14
  build_wheels_linux:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
        - os: ubuntu-24.04
        - os: ubuntu-24.04-arm
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install build dependencies
      run: |
        sudo apt-get -y install autoconf automake autopoint autotools-dev build-essential git libtool pkg-config
    - name: Prepare build
      run: |
        python utils/update_source.py
    - name: Build Python wheels
      uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
      env:
        CIBW_BEFORE_BUILD_LINUX: python utils/update_source.py
        CIBW_ENABLE: ${{ !(github.event_name == 'release' && github.event.action == 'published') && 'cpython-prerelease' || '' }}
        CIBW_TEST_COMMAND: python run_tests.py
        CIBW_TEST_SOURCES: run_tests.py test_data tests
      with:
        package-dir: .
        output-dir: dist
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
        path: dist/*.whl
        retention-days: 14
  build_wheels_macos:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
        - os: macos-26
        - os: macos-26-intel
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Install build dependencies
      run: |
        brew update -q
        brew install -q autoconf automake gettext gnu-sed libtool pkgconfig || true
        ln -s /usr/local/bin/glibtoolize /usr/local/bin/libtoolize
    - name: Prepare build
      run: |
        python utils/update_source.py
    - name: Build Python wheels
      uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
      env:
        CIBW_ENABLE: ${{ !(github.event_name == 'release' && github.event.action == 'published') && 'cpython-prerelease' || '' }}
        CIBW_TEST_COMMAND: python run_tests.py
        CIBW_TEST_SOURCES: run_tests.py test_data tests
      with:
        package-dir: .
        output-dir: dist
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
        path: dist/*.whl
        retention-days: 14
  build_wheels_windows:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      matrix:
        include:
        - os: windows-11-arm
        - os: windows-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Prepare build
      run: |
        python utils/update_source.py
    - name: Build Python wheels
      uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
      env:
        CIBW_ENABLE: ${{ !(github.event_name == 'release' && github.event.action == 'published') && 'cpython-prerelease' || '' }}
        CIBW_TEST_COMMAND: python run_tests.py
        CIBW_TEST_SOURCES: run_tests.py test_data tests
      with:
        package-dir: .
        output-dir: dist
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
        path: dist/*.whl
        retention-days: 14
  upload_pypi:
    needs: [build_sdist, build_wheels_linux, build_wheels_macos, build_wheels_windows]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: pypi
    permissions:
      id-token: write
    if: github.event_name == 'release' && github.event.action == 'published'
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
